name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    # Serveur temporaire, détruit à la fin du job ; pnpm test:db y crée la base choofauto_test.
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: choofauto
          POSTGRES_PASSWORD: choofauto
          POSTGRES_DB: choofauto
        # Même port qu'en local (décision 0012) : le garde-fou de l'import n'accepte que 5434.
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U choofauto"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://choofauto:choofauto@localhost:5434/choofauto?schema=public
      # Adresses fictives (domaine réservé example.com) : les vraies ne quittent jamais .env.local.
      STAFF_EMAIL_ALLOWLIST: test.fondateur@example.com,test.cofondatrice@example.com
      # Valeur d'essai pour la construction, sans usage réel.
      AUTH_SECRET: ci-only-not-a-real-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Version de pnpm lue dans le champ packageManager de package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      # Génère aussi le client Prisma (script postinstall).
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm check:foundations
      - run: pnpm test
      # Recrée la base choofauto_test sur le même serveur : migrations, deux passages du seed
      # (le second ne doit créer aucun doublon), puis les tests qui interrogent la base.
      - run: pnpm test:db
      - run: pnpm build
