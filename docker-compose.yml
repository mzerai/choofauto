# Base locale du pilote : PostgreSQL 16 avec l'extension pgvector
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: choofauto
      POSTGRES_PASSWORD: choofauto
      POSTGRES_DB: choofauto
    ports:
      # Port 5434 sur la machine : 5432 et 5433 sont déjà pris par d’autres projets.
      - "5434:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
volumes:
  db-data:
